<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice Shop Login Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #252525;
      color: white;
      margin: 0;
    }

    header {
      padding: 20px;
      background: #546e35;
      font-size: 24px;
    }

    main {
      max-width: 360px;
      margin: 60px auto;
      padding: 28px;
      background: #353535;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 18px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 4px;
    }

    button {
      margin-top: 24px;
      background: #aed581;
      border: none;
      cursor: pointer;
    }
  </style>

  <script src="script.js" defer></script>
</head>

<body>
  <header>Juice Shop — Student Demo</header>

  <main>
    <h1>Login</h1>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        minlength="8"
        required
      >

      <button type="submit">Log in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
